[Gameplay]

## Revive cooldown for a solo death (seconds, clamped 15-30)
## Setting type: Single
## Default value: 20
ReviveCooldownSeconds = 20

## Fraction of max HP restored on revive (0.1 - 1.0)
## Setting type: Single
## Default value: 0.5
ReviveHealthPercent = 0.5

## Damage immunity after revive (seconds)
## Setting type: Single
## Default value: 2.5
ReviveInvulnerabilitySeconds = 2.5

## Replicate quest-related PlayerData bool/int flags changed during NPC dialogue (best-effort)
## Setting type: Boolean
## Default value: true
SyncQuestFlags = true

[Keybinds]

## Keybind for ToggleMenu
## Setting type: KeyCode
## Default value: F10
ToggleMenu = F10

## Keybind for ToggleSpectatorCamera
## Setting type: KeyCode
## Default value: F9
ToggleSpectatorCamera = F9

## Keybind for ToggleDiagnostics
## Setting type: KeyCode
## Default value: F11
ToggleDiagnostics = F11

[Network]

## Default UDP port for direct connections
## Setting type: Int32
## Default value: 7777
DefaultUdpPort = 7777

## Network replication tick rate (20-60 Hz)
## Setting type: Int32
## Default value: 30
TickRateHz = 30

## Automatically attempt to reconnect after an unexpected disconnect
## Setting type: Boolean
## Default value: true
AutoReconnect = true

## Maximum number of automatic reconnection attempts (1-10)
## Setting type: Int32
## Default value: 5
MaxReconnectAttempts = 5

## Maximum Steam lobby size including yourself (2-8); values above 2 enable experimental full-mesh mode.
## Set the same value on every player.
## Setting type: Int32
## Default value: 2
SteamMaxPlayers = 2

## Persist non-secret connection targets in PlayerPrefs
## Setting type: Boolean
## Default value: false
SaveConnectionHistory = false

[UI]

## UI language: Auto (system), English or Russian
## Setting type: String
## Default value: Auto
## Acceptable values:
##   - Auto
##   - English
##   - Russian
Language = Auto

## Set to true after the first-run hint is dismissed (the Settings tab can show it again)
## Setting type: Boolean
## Default value: false
OnboardingCompleted = false

[Visuals]

## Enable cyan dash trail for Player 2
## Setting type: Boolean
## Default value: true
EnablePlayer2DashTrail = true

## Hue shift for Player 2 cloak (0.58 = azure blue)
## Setting type: Single
## Default value: 0.58
Player2HueShift = 0.58

[Quality]

## Quality preset (Low/Medium/High/Custom)
## Setting type: QualityLevel
## Default value: Medium
Preset = Medium
