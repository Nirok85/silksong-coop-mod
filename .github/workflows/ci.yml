name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      require_mod:
        description: Fail if the protected Mod build does not run successfully
        type: boolean
        default: false

# A newer commit on the same branch makes the previous run obsolete. This frees both
# hosted minutes and the single self-hosted Mod runner for the latest revision.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  core:
    name: Core - build + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore tests/SilksongCoop.Tests/SilksongCoop.Tests.csproj

      - name: Build Core (warnings as errors)
        run: dotnet build src/SilksongCoop.Core/SilksongCoop.Core.csproj -c Release -p:TreatWarningsAsErrors=true

      - name: Run tests
        run: >-
          dotnet test tests/SilksongCoop.Tests/SilksongCoop.Tests.csproj
          -c Release
          --logger "trx;LogFileName=results.trx"
          --blame-hang --blame-hang-timeout 5m

      - name: Verify test results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          trx=$(find . -name results.trx -print -quit)
          if [ -z "$trx" ]; then
            echo "::error::results.trx was not produced; the test run cannot be trusted"
            exit 1
          fi
          if grep -q 'outcome="NotExecuted"' "$trx"; then
            echo "::error::tests were reported as NotExecuted; inspect the uploaded results.trx"
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/results.trx'
          if-no-files-found: error

  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check release metadata
        shell: pwsh
        run: ./scripts/preflight-release.ps1 -MetadataOnly

  benchmarks:
    name: Benchmarks - dry smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore benchmark project
        run: dotnet restore tools/SilksongCoop.Benchmarks/SilksongCoop.Benchmarks.csproj

      - name: Run BenchmarkDotNet dry job
        run: >-
          dotnet run --project tools/SilksongCoop.Benchmarks -c Release --no-restore --
          --filter "*" --job dry

  mod:
    name: Mod - compile against game assemblies (self-hosted)
    # Game assemblies (Assembly-CSharp.dll, UnityEngine.*, TeamCherry.*) are proprietary
    # and cannot be committed or downloaded on a hosted runner, so the Mod project can
    # only be compiled on the self-hosted runner that has Silksong installed.
    #
    # Only the protected master branch may execute on the persistent game runner.
    # Keep the job opt-in until a Silksong runner is registered. Otherwise every
    # push queues indefinitely and leaves a pending deployment in GitHub.
    if: vars.SILKSONG_MOD_RUNNER_ENABLED == 'true' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, silksong]
    timeout-minutes: 30
    environment: silksong-mod-build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-mod-${{ hashFiles('**/*.csproj', 'nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-mod-
            ${{ runner.os }}-nuget-

      - name: Validate Managed directory
        env:
          MANAGED_DIR: ${{ vars.SILKSONG_MANAGED_DIR }}
        run: |
          if [ -z "$MANAGED_DIR" ]; then
            echo "::error::SILKSONG_MANAGED_DIR repository variable is not set"
            exit 1
          fi
          case "$MANAGED_DIR" in
            /home/*|/opt/*|/usr/local/*)
              ;;
            *)
              echo "::error::SILKSONG_MANAGED_DIR must be an absolute path under /home, /opt, or /usr/local"
              exit 1
              ;;
          esac
          case "$MANAGED_DIR" in
            *$GITHUB_WORKSPACE*|*$RUNNER_WORKSPACE*)
              echo "::error::SILKSONG_MANAGED_DIR must not be inside the workspace"
              exit 1
              ;;
          esac
          test -f "$MANAGED_DIR/Assembly-CSharp.dll" || { echo "::error::Assembly-CSharp.dll not found in $MANAGED_DIR"; exit 1; }
          test -f "$MANAGED_DIR/UnityEngine.CoreModule.dll" || { echo "::error::UnityEngine.CoreModule.dll not found in $MANAGED_DIR"; exit 1; }
          test -f "$MANAGED_DIR/TeamCherry.TK2D.dll" || { echo "::error::TeamCherry.TK2D.dll not found in $MANAGED_DIR"; exit 1; }

      - name: Run full release preflight against game assemblies
        env:
          ManagedDir: ${{ vars.SILKSONG_MANAGED_DIR }}
        shell: pwsh
        run: ./scripts/preflight-release.ps1

  mod-status:
    name: Mod build status
    if: always()
    needs: mod
    runs-on: ubuntu-latest
    env:
      MOD_RESULT: ${{ needs.mod.result }}
      REQUIRE_MOD: ${{ inputs.require_mod }}
    steps:
      - name: Report Mod build coverage
        shell: bash
        run: |
          case "$MOD_RESULT" in
            success)
              echo "Mod compiled against game assemblies and passed release preflight." >> "$GITHUB_STEP_SUMMARY"
              ;;
            skipped)
              echo "Mod build skipped. It requires a protected master push or dispatch and an enabled Silksong runner." >> "$GITHUB_STEP_SUMMARY"
              if [ "$REQUIRE_MOD" = true ]; then
                echo "::error::A Mod build was requested but the protected runner gate is closed."
                exit 1
              fi
              echo "::notice::Mod compilation was skipped."
              ;;
            *)
              echo "Mod build result: $MOD_RESULT" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Mod build result: $MOD_RESULT"
              exit 1
              ;;
          esac
