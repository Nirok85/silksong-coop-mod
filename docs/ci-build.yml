name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  core:
    name: Core — build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore tests/SilksongCoop.Tests/SilksongCoop.Tests.csproj

      - name: Build Core (warnings as errors)
        run: dotnet build src/SilksongCoop.Core/SilksongCoop.Core.csproj -c Release -p:TreatWarningsAsErrors=true

      - name: Run tests
        run: dotnet test tests/SilksongCoop.Tests/SilksongCoop.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/results.trx'
          if-no-files-found: ignore

  # Mod project requires game DLLs (Assembly-CSharp, UnityEngine, etc.) which cannot
  # be redistributed. Build it only on a self-hosted runner with the game installed.
  mod:
    name: Mod — syntax check (optional)
    runs-on: ubuntu-latest
    if: false  # enable on a self-hosted runner with the game's Managed/ folder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Mod
        run: dotnet build src/SilksongCoop.Mod/SilksongCoop.Mod.csproj -c Release -p:TreatWarningsAsErrors=true -p:ManagedDir="${{ env.MANAGED_DIR }}"
        env:
          MANAGED_DIR: /path/to/Hollow Knight Silksong/Hollow Knight Silksong_Data/Managed